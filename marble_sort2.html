</head><body><canvas id="c"></canvas><script>
// ═══════════════════════════════════════════════════════════════════════
//  Marble Sort2 — 완전 신규 구현 (2026-07-07 시작)
//  · 레퍼런스 영상의 메커닉/구성만 클론 — 코드·아트 전부 자체 제작(재사용 0)
//  · 자체 미니 물리(버렛 원 + 세그먼트 벽 + 컨베이어 소켓), 캔버스 절차 아트
// ═══════════════════════════════════════════════════════════════════════
'use strict';

// ── 디자인 좌표계(신규: 720×1560) ─────────────────────────────────────
const DW = 720, DH = 1560;
const BALL_R = 17;                       // 공 반지름
const BALL_D = BALL_R * 2;

// ── 팔레트(레퍼런스 육안 톤을 자체 스타일로 재해석) ────────────────────
const PAL = {
  bg: '#5573B8', wall: '#3D5288', zoneTop: '#9FB2BE', zoneBot: '#C5CEE0',
  seat: '#DFE6F4', hudPill: '#9B7BD8', hudPillDark: '#7E5EC0', coinGold: '#FFC63A',
  lockSlot: '#ABB6AE', lockSlotDark: '#8D9990',
  railBody: '#6F7683', railSocket: '#565C66', railSlit: '#F2F4F8',
  colors: { green: '#34C04A', blue: '#2E64E9', orange: '#FF9718', yellow: '#FFD53E', red: '#F0384E', purple: '#8B46E0' },
  colorsDark: { green: '#1E8F32', blue: '#1B44B0', orange: '#C86B05', yellow: '#D9A81B', red: '#B01F33', purple: '#5F27A5' },
  colorsLight: { green: '#7FE392', blue: '#7FA4F5', orange: '#FFC470', yellow: '#FFEA96', red: '#F98CA0', purple: '#BE93F0' },
};
const COLOR_KEYS = Object.keys(PAL.colors);

// ── 레이아웃 ──────────────────────────────────────────────────────────
const LO = {
  hudY: 88, boosterY: 208,
  zoneTopY: 300, zoneBotY: 1210,          // 보드 존 상/하(깔때기 목 전)
  boardCell: 92, boardTopY: 430,
  funnelTipY: 1245, mouthHalf: 46,        // 깔때기 목
  railTop: 1330, railBot: 1372, railL: 128, railR: 592,
  trayTopY: 1445, trayW: 128, trayBandH: 60, trayCapH: 84,
};

// ── 유틸 ─────────────────────────────────────────────────────────────
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const TAU = Math.PI * 2;
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function shade(hex, f) {   // f>0 밝게, f<0 어둡게
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = (c) => clamp(Math.round(f > 0 ? c + (255 - c) * f : c * (1 + f)), 0, 255);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}

// ── 절차 아트(전부 자체 드로잉 — 로드시 1회 오프스크린 베이크) ─────────
const ART = {};
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// 팝잇 타일(3×3 알 돔) — 자체 스타일: 통통한 라운드 + 위 하이라이트 띠
function bakePopTile(colorKey) {
  const S = 184, c = mkCanvas(S, S), g = c.getContext('2d');
  const base = PAL.colors[colorKey], dark = PAL.colorsDark[colorKey], light = PAL.colorsLight[colorKey];
  // 몸통(아래 두께)
  rr(g, 6, 14, S - 12, S - 20, 34); g.fillStyle = dark; g.fill();
  // 윗면
  const grd = g.createLinearGradient(0, 6, 0, S - 26);
  grd.addColorStop(0, shade(base, 0.18)); grd.addColorStop(1, base);
  rr(g, 6, 6, S - 12, S - 26, 34); g.fillStyle = grd; g.fill();
  // 3×3 알 돔
  for (let r = 0; r < 3; r++) for (let q = 0; q < 3; q++) {
    const cx = 40 + q * 52, cy = 36 + r * 50, rad = 23;
    const dg = g.createRadialGradient(cx - 7, cy - 9, 3, cx, cy, rad);
    dg.addColorStop(0, light); dg.addColorStop(0.65, base); dg.addColorStop(1, shade(base, -0.16));
    g.beginPath(); g.arc(cx, cy, rad, 0, TAU); g.fillStyle = dg; g.fill();
  }
  return c;
}
// 알이 빠진 팝잇 프레임(우물만) — 방출 진행 표시
function bakePopFrame(colorKey) {
  const S = 184, c = mkCanvas(S, S), g = c.getContext('2d');
  const base = PAL.colors[colorKey], dark = PAL.colorsDark[colorKey];
  rr(g, 6, 14, S - 12, S - 20, 34); g.fillStyle = dark; g.fill();
  const grd = g.createLinearGradient(0, 6, 0, S - 26);
  grd.addColorStop(0, shade(base, 0.18)); grd.addColorStop(1, base);
  rr(g, 6, 6, S - 12, S - 26, 34); g.fillStyle = grd; g.fill();
  for (let r = 0; r < 3; r++) for (let q = 0; q < 3; q++) {
    const cx = 40 + q * 52, cy = 36 + r * 50, rad = 20;
    const dg = g.createRadialGradient(cx, cy + 4, 2, cx, cy, rad);
    dg.addColorStop(0, shade(base, -0.42)); dg.addColorStop(1, shade(base, -0.2));
    g.beginPath(); g.ellipse(cx, cy, rad, rad * 0.88, 0, 0, TAU); g.fillStyle = dg; g.fill();
  }
  return c;
}
// 플레인 블록(미노출)
function bakePlainTile(colorKey) {
  const S = 184, c = mkCanvas(S, S), g = c.getContext('2d');
  const base = PAL.colors[colorKey], dark = PAL.colorsDark[colorKey];
  rr(g, 8, 16, S - 16, S - 22, 30); g.fillStyle = dark; g.fill();
  const grd = g.createLinearGradient(0, 8, 0, S - 24);
  grd.addColorStop(0, shade(base, 0.22)); grd.addColorStop(1, base);
  rr(g, 8, 8, S - 16, S - 26, 30); g.fillStyle = grd; g.fill();
  g.fillStyle = 'rgba(255,255,255,0.28)';
  rr(g, 22, 18, S - 44, 34, 18); g.fill();
  return c;
}
// 빈자리 시트
function bakeSeat() {
  const S = 160, c = mkCanvas(S, S), g = c.getContext('2d');
  rr(g, 12, 12, S - 24, S - 24, 26); g.fillStyle = PAL.seat; g.fill();
  return c;
}
// 공(색별 광택 볼)
function bakeBall(colorKey) {
  const S = 96, c = mkCanvas(S, S), g = c.getContext('2d');
  const base = PAL.colors[colorKey];
  const dg = g.createRadialGradient(S * 0.38, S * 0.32, 4, S / 2, S / 2, S * 0.46);
  dg.addColorStop(0, PAL.colorsLight[colorKey]); dg.addColorStop(0.55, base); dg.addColorStop(1, shade(base, -0.25));
  g.beginPath(); g.arc(S / 2, S / 2, S * 0.46, 0, TAU); g.fillStyle = dg; g.fill();
  g.beginPath(); g.ellipse(S * 0.38, S * 0.28, S * 0.13, S * 0.08, -0.5, 0, TAU);
  g.fillStyle = 'rgba(255,255,255,0.75)'; g.fill();
  return c;
}
// 트레이 캡(구멍 3) / 대기 밴드
function bakeTrayCap(colorKey) {
  const W = 256, H = 168, c = mkCanvas(W, H), g = c.getContext('2d');
  const base = PAL.colors[colorKey], dark = PAL.colorsDark[colorKey];
  rr(g, 6, 26, W - 12, H - 32, 38); g.fillStyle = dark; g.fill();
  const grd = g.createLinearGradient(0, 6, 0, H - 20);
  grd.addColorStop(0, shade(base, 0.2)); grd.addColorStop(1, base);
  rr(g, 6, 6, W - 12, H - 38, 38); g.fillStyle = grd; g.fill();
  for (let i = 0; i < 3; i++) {
    const cx = 62 + i * 66, cy = 62;
    const hg = g.createRadialGradient(cx, cy + 6, 2, cx, cy, 26);
    hg.addColorStop(0, shade(base, -0.5)); hg.addColorStop(1, shade(base, -0.24));
    g.beginPath(); g.ellipse(cx, cy, 26, 22, 0, 0, TAU); g.fillStyle = hg; g.fill();
  }
  return c;
}
function bakeTrayBand(colorKey) {
  const W = 256, H = 128, c = mkCanvas(W, H), g = c.getContext('2d');
  const base = PAL.colors[colorKey], dark = PAL.colorsDark[colorKey];
  rr(g, 6, 22, W - 12, H - 28, 34); g.fillStyle = dark; g.fill();
  const grd = g.createLinearGradient(0, 4, 0, H - 24);
  grd.addColorStop(0, shade(base, 0.2)); grd.addColorStop(1, base);
  rr(g, 6, 4, W - 12, H - 30, 34); g.fillStyle = grd; g.fill();
  g.fillStyle = 'rgba(255,255,255,0.24)';
  rr(g, 20, 12, W - 40, 24, 14); g.fill();
  return c;
}
function bakeAllArt() {
  ART.tilePop = {}; ART.tileFrame = {}; ART.tilePlain = {}; ART.ball = {}; ART.cap = {}; ART.band = {};
  for (const k of COLOR_KEYS) {
    ART.tilePop[k] = bakePopTile(k);
    ART.tileFrame[k] = bakePopFrame(k);
    ART.tilePlain[k] = bakePlainTile(k);
    ART.ball[k] = bakeBall(k);
    ART.cap[k] = bakeTrayCap(k);
    ART.band[k] = bakeTrayBand(k);
  }
  ART.seat = bakeSeat();
}
// ── 자체 미니 물리: 버렛 원 + 정적 세그먼트 벽 ─────────────────────────
//  matter.js 미사용 — 이 게임에 필요한 만큼만 직접 구현(중력, 원끼리 밀어내기, 벽 반사).
'use strict';

class Phys2 {
  constructor() {
    this.orbs = new Map();       // id → {x,y,px,py,r,free,colorKey}
    this.segs = [];              // 벽 세그먼트 {x1,y1,x2,y2}
    this.g = 0.55;               // 중력(px/tick²)
    this.iter = 5;
  }
  addSeg(x1, y1, x2, y2) { this.segs.push({ x1, y1, x2, y2 }); }
  spawn(id, colorKey, x, y, vx, vy) {
    this.orbs.set(id, { id, colorKey, x, y, px: x - vx, py: y - vy, r: BALL_R, free: true });
  }
  remove(id) { this.orbs.delete(id); }
  pin(id) { const o = this.orbs.get(id); if (o) o.free = false; }
  unpin(id, vx = 0, vy = 0) { const o = this.orbs.get(id); if (o) { o.free = true; o.px = o.x - vx; o.py = o.y - vy; } }
  place(id, x, y) { const o = this.orbs.get(id); if (o) { o.x = x; o.y = y; o.px = x; o.py = y; } }
  step() {
    // 적분
    for (const o of this.orbs.values()) {
      if (!o.free) continue;
      const vx = (o.x - o.px) * 0.995, vy = (o.y - o.py) * 0.995 + this.g;
      o.px = o.x; o.py = o.y; o.x += vx; o.y += vy;
    }
    // 반복 제약
    for (let it = 0; it < this.iter; it++) {
      // 원-원(자유 공끼리 + 자유↔고정은 고정이 안 밀림)
      const arr = [...this.orbs.values()];
      for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {
        const a = arr[i], b = arr[j];
        if (!a.free && !b.free) continue;
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy; const min = a.r + b.r;
        if (d2 >= min * min || d2 === 0) continue;
        const d = Math.sqrt(d2), pen = (min - d) / d;
        dx *= pen * 0.5; dy *= pen * 0.5;
        if (a.free && b.free) { a.x -= dx; a.y -= dy; b.x += dx; b.y += dy; }
        else if (a.free) { a.x -= dx * 2; a.y -= dy * 2; }
        else { b.x += dx * 2; b.y += dy * 2; }
      }
      // 원-세그먼트
      for (const o of this.orbs.values()) {
        if (!o.free) continue;
        for (const s of this.segs) {
          const sx = s.x2 - s.x1, sy = s.y2 - s.y1;
          const L2 = sx * sx + sy * sy; if (!L2) continue;
          let t = ((o.x - s.x1) * sx + (o.y - s.y1) * sy) / L2;
          t = clamp(t, 0, 1);
          const cx = s.x1 + sx * t, cy = s.y1 + sy * t;
          let dx = o.x - cx, dy = o.y - cy;
          const d2 = dx * dx + dy * dy;
          if (d2 >= o.r * o.r || d2 === 0) continue;
          const d = Math.sqrt(d2), pen = o.r - d;
          o.x += (dx / d) * pen; o.y += (dy / d) * pen;
        }
      }
    }
  }
}

// ── 레벨 데이터(신규 포맷) ─────────────────────────────────────────────
//  board.rows: 문자 그리드 — '.'=존 밖, '_'=빈칸(시트), 대문자=플레인 블록, 소문자=팝잇(노출)
//  색 문자: g/b/o/y/r/p. trays: 열별 스택(위=활성 캡부터).
const CH2KEY = { g: 'green', b: 'blue', o: 'orange', y: 'yellow', r: 'red', p: 'purple' };
const LEVELS2 = [
  { id: 1, rows: ['gg', 'bb', 'oo'], off: [1, 0], trays: [['green','blue','orange'], ['blue','green','orange'], ['orange','green','blue'], ['blue','orange','green']] },
  { id: 2, rows: ['gby', 'ygb', 'byg'], off: [1, 0], trays: [['green','yellow','blue'], ['yellow','blue','green'], ['blue','green','yellow'], ['green','blue','yellow']] },
  { id: 3, rows: ['obg', 'gob', 'bgo'], off: [1, 0], trays: [['orange','green','blue'], ['green','blue','orange'], ['blue','orange','green'], ['orange','blue','green']] },
  // ★레벨 4 = 레퍼런스 영상 실측 맵(계단형 존 + 4색)
  { id: 4, rows: ['GB...', 'BO...', 'yOBG.', 'gyoo.'], off: [0, 0],
    trays: [
      ['orange','green','blue','yellow','green'],
      ['yellow','blue','orange','green','blue'],
      ['blue','orange','green','orange','yellow'],
      ['green','yellow','yellow','blue','orange'],
    ] },
  { id: 5, rows: ['GBOG', 'OYBY', 'gboy', 'ybgo'], off: [0, 0],
    trays: [
      ['green','orange','yellow','blue','green','orange'],
      ['blue','yellow','green','orange','blue','yellow'],
      ['orange','blue','blue','yellow','orange','green'],
      ['yellow','green','orange','green','yellow','blue'],
    ] },
  { id: 6, rows: ['RBOG', 'GYRB', 'obry', 'ygbo', 'rogb'], off: [0, 0],
    trays: [
      ['orange','red','green','blue','yellow','red','green'],
      ['yellow','blue','orange','red','green','blue','... '],
      ['blue','green','red','yellow','orange','green','red'],
      ['red','orange','yellow','green','blue','yellow','blue'],
    ] },
];
// 레벨 6 trays 자리표시 정정 + 공급=수요 자동 검증/보정
function normalizeLevel(lv) {
  const supply = {};
  for (const row of lv.rows) for (const ch of row) {
    const k = CH2KEY[ch.toLowerCase()]; if (k) supply[k] = (supply[k] || 0) + 9;
  }
  const demand = {};
  const flat = [];
  for (const col of lv.trays) for (const c of col) if (CH2KEY[c] || COLOR_KEYS.includes(c)) flat.push(c);
  for (const c of flat) demand[c] = (demand[c] || 0) + 3;
  // 보정: 수요 흘러넘침/부족 시 트레이를 공급에 맞춰 재구성(색별 supply/3 개의 트레이를 열에 라운드로빈)
  let ok = true;
  for (const k in supply) if ((demand[k] || 0) * 1 !== supply[k] / 3 * 3 || supply[k] % 3) ok = false;
  for (const k in demand) if (!supply[k]) ok = false;
  let total = 0; for (const k in supply) total += supply[k] / 3;
  let dTotal = flat.length;
  if (!ok || total !== dTotal) {
    const pool = [];
    for (const k in supply) for (let i = 0; i < supply[k] / 3; i++) pool.push(k);
    // 안정 셔플(레벨 id 시드)
    let s = lv.id * 9301 + 49297;
    const rnd = () => { s = (s * 233280 + 9301) % 2147483647; return (s % 1000) / 1000; };
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    // 같은 색 트레이가 4열 활성캡에 동시에 몰리지 않게 인터리브 배분
    const cols = [[], [], [], []];
    pool.forEach((k, i) => cols[i % 4].push(k));
    lv.trays = cols;
  }
  return lv;
}
// ── 게임 상태/로직 (신규 구현) ─────────────────────────────────────────
'use strict';

const RAIL = {
  L: LO.railL, R: LO.railR, T: LO.railTop, B: LO.railBot,
  get cy() { return (this.T + this.B) / 2; },
  get rad() { return (this.B - this.T) / 2 + BALL_R * 1.15; },   // 반원 회전 반경(시각 궤도)
  get straight() { return this.R - this.L; },
  get perim() { return 2 * this.straight + TAU * this.rad; },
  sockets: 26,
  speed: 300 / 60,                     // px/tick (영상 실측 스케일)
};
// 둘레 s → 좌표(윗줄: s 0..straight 왼→오 증가, 시계). 진행은 s 감소(윗줄 왼쪽으로).
function railPt(s) {
  const P = RAIL.perim, st = RAIL.straight, r = RAIL.rad;
  let p = ((s % P) + P) % P;
  if (p < st) return { x: RAIL.L + p, y: RAIL.T, top: true };
  p -= st;
  const half = TAU * r / 2;
  if (p < half) { const a = p / r - Math.PI / 2; return { x: RAIL.R + Math.cos(a) * r, y: RAIL.cy + Math.sin(a) * r, top: false }; }
  p -= half;
  if (p < st) return { x: RAIL.R - p, y: RAIL.B, top: false };
  p -= st;
  const a = p / r + Math.PI / 2;
  return { x: RAIL.L + Math.cos(a) * r, y: RAIL.cy + Math.sin(a) * r, top: false };
}

function makeGame(levelIdx) {
  const lv = normalizeLevel(JSON.parse(JSON.stringify(LEVELS2[clamp(levelIdx - 1, 0, LEVELS2.length - 1)])));
  const G = {
    lvId: lv.id, status: 'playing', coins: +(localStorage.ms2_coins || 575),
    phys: new Phys2(), nextId: 1,
    tiles: [], seats: [], balls: new Map(),
    trays: [], railOff: 0, colQ: [null, null],   // 입구 컬럼(아래, 위)
    fx: [], shakeT: 0, tapLock: 0, failT: 0,
  };
  // 보드 타일
  const cols = Math.max(...lv.rows.map(r => r.length));
  const bw = cols * LO.boardCell;
  const bx0 = (DW - bw) / 2 + (lv.off ? lv.off[0] * LO.boardCell : 0);
  lv.rows.forEach((row, r) => {
    [...row].forEach((ch, q) => {
      if (ch === '.') return;
      const x = bx0 + q * LO.boardCell + LO.boardCell / 2;
      const y = LO.boardTopY + r * LO.boardCell + LO.boardCell / 2;
      G.seats.push({ x, y });
      if (ch === '_') return;
      const key = CH2KEY[ch.toLowerCase()];
      G.tiles.push({ col: q, row: r, x, y, colorKey: key, exposed: ch === ch.toLowerCase(), left: 9, gone: [], pour: null });
    });
  });
  // 노출 갱신: 같은 열에서 자기 아래(행+1)에 타일이 없으면 노출
  G.exposeTick = () => {
    for (const t of G.tiles) {
      if (t.exposed || t.left <= 0) continue;
      const below = G.tiles.find(o => o !== t && o.col === t.col && o.row === t.row + 1 && o.left > 0);
      if (!below) { t.exposed = true; G.fx.push({ k: 'expose', x: t.x, y: t.y, t: 0 }); }
    }
  };
  // 트레이
  const gapX = (DW - 4 * LO.trayW) / 5;
  lv.trays.forEach((stack, i) => {
    G.trays.push({ i, x: gapX + LO.trayW / 2 + i * (LO.trayW + gapX), stack: stack.slice(), holes: [null, null, null], incoming: 0, lift: null, riseT: 1 });
  });

// ── 방출: 팝잇 타일 탭 → 9→1 순서(아랫줄 오른쪽부터) 자기 알 자리에서 클러스터 롤 ──

// ── 입구 컬럼(FIFO 2칸) + 레일 탑승 ───────────────────────────────────

// ── 레일 순환 + 트레이 드롭 ───────────────────────────────────────────

    const pt = railPt(m.s);

// 존 실루엣(보드 몰드): 계단형 라운드 패스(레벨 좌석 bbox 기반)
function zonePath(g, G, pad) {

  const x0 = Math.min(...xs) - half, x1 = Math.max(...xs) + half;

    const yBot = LO.boardTopY + r * LO.boardCell + half;

function draw(G, dt) {

    const x = DW / 2 - 180 + i * 128;
    g.fillStyle = PAL.lockSlotDark; rr(g, x - 46, LO.boosterY - 40, 92, 92, 22); g.fill();
    g.fillStyle = PAL.lockSlot; rr(g, x - 46, LO.boosterY - 46, 92, 86, 22); g.fill();
    g.fillStyle = '#fff'; g.font = '700 30px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('🔒', x, LO.boosterY - 16);
    g.font = '800 20px system-ui'; g.fillText(labels[i], x, LO.boosterY + 22);
  }
}
function drawEnd(G) {
  const g = CX;
  g.fillStyle = 'rgba(20,28,52,0.45)'; g.fillRect(0, 0, DW, DH);
  const won = G.status === 'won';
  pill(g, DW / 2 - 180, DH / 2 - 120, 360, 90, won ? '#37B84E' : '#E5484D', won ? '정리 완료!' : '공간이 없어요!', 36);
  pill(g, DW / 2 - 150, DH / 2 + 10, 300, 76, PAL.hudPill, won ? '다음 레벨 ▶' : '다시 시작 ↻', 30);
  G._endBtn = { x: DW / 2 - 150, y: DH / 2 + 10, w: 300, h: 76 };
}

// ── 부팅/루프/입력 ────────────────────────────────────────────────────
let GAME;
function bootMS2() {
  CV = document.getElementById('c'); CX = CV.getContext('2d');
  bakeAllArt(); fitCanvas();
  addEventListener('resize', fitCanvas);
  const lv = +(new URLSearchParams(location.search).get('lv') || localStorage.ms2_lv || 1);
  GAME = makeGame(lv);
  CV.addEventListener('pointerdown', (ev) => {
    const p = toGame(ev.clientX, ev.clientY);
    if (GAME.status !== 'playing') {
      const b = GAME._endBtn;
      if (b && p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) {
        const next = GAME.status === 'won' ? GAME.lvId + 1 : GAME.lvId;
        localStorage.ms2_lv = clamp(next, 1, LEVELS2.length);
        GAME = makeGame(clamp(next, 1, LEVELS2.length));
      }
      return;
    }
    for (const t of GAME.tiles) {
      if (t.left <= 0 || !t.exposed) continue;
      if (Math.abs(p.x - t.x) < 46 && Math.abs(p.y - t.y) < 46) { tapTile(GAME, t); break; }
    }
  });
  let last = performance.now(), acc = 0;
  const TICK = 1000 / 60;
  function loop(now) {
    requestAnimationFrame(loop);
    acc += Math.min(100, now - last); last = now;
    while (acc >= TICK) {
      acc -= TICK;
      const dt = TICK / 1000;
      pourTick(GAME, dt);
      GAME.phys.step();
      columnTick(GAME, dt);
      railTick(GAME, dt);
      dropTick(GAME, dt);
      trayTick(GAME, dt);
      winFailTick(GAME, dt);
    }
    draw(GAME, TICK / 1000);
  }
  requestAnimationFrame(loop);
  // 헤드리스 검증 훅
  window.__MS2 = {
    get G() { return GAME; },
    tap(i) { const t = GAME.tiles.filter(t2 => t2.exposed && t2.left > 0)[i || 0]; if (t) tapTile(GAME, t); return !!t; },
    state() {
      let ride = 0, fall = 0, seat = 0;
      for (const m of GAME.balls.values()) { if (m.mode === 'ride') ride++; else if (m.mode === 'fall' || m.mode === 'queue') fall++; else if (m.mode === 'seated') seat++; }
      return { status: GAME.status, ride, fall, seat, tiles: GAME.tiles.filter(t => t.left > 0).length, trays: GAME.trays.map(t => t.stack.length) };
    },
  };
}
addEventListener('DOMContentLoaded', bootMS2);
</script></body></html>
