<style>
 html,body{margin:0;height:100%;background:#7ec8f2;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}
 #app{display:flex;justify-content:center}#app canvas{display:block}
 .pill{background:#ffffffe8;border:3px solid #2a4a7a22;border-radius:16px;box-shadow:0 3px 0 #00000022;padding:6px 14px;font-weight:800;color:#2a4a7a}
 #balls{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;z-index:10;text-align:center;font-size:15px}

 #stageLb{position:fixed;top:calc(10px + env(safe-area-inset-top));right:56px;z-index:10;font-size:13px}
 #covwrap{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:170px;z-index:10;text-align:center}
 #covbar{height:18px;background:#ffffffd8;border-radius:12px;overflow:hidden;box-shadow:0 3px 0 #00000022;border:3px solid #2a4a7a22}
 #covfill{height:100%;width:0%;background:linear-gradient(90deg,#ffd24a,#ff8a3c);border-radius:9px;transition:width .25s}
 #covtxt{font-size:13px;font-weight:800;color:#fff;text-shadow:0 2px 3px #0007;margin-top:3px}
 #banner{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:30;display:none;text-align:center}
 #banner .big{font-size:34px;font-weight:900;color:#fff;text-shadow:0 4px 0 #0006;letter-spacing:1px}
 #banner button{margin-top:14px;background:linear-gradient(180deg,#7ade5a,#3cb82e);border:none;border-radius:16px;color:#fff;font-size:19px;font-weight:800;padding:12px 34px;font-family:inherit;box-shadow:0 5px 0 #2a8a1e}
 #banner button:active{transform:translateY(3px);box-shadow:0 2px 0 #2a8a1e}
 #tip{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ffffff;font-size:13px;text-shadow:0 2px 3px #0007;z-index:10;pointer-events:none;font-weight:700}
 #gear{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:25;background:#ffffffd8;border:3px solid #2a4a7a22;color:#2a4a7a;border-radius:50%;width:38px;height:38px;font-size:17px;padding:0;box-shadow:0 3px 0 #00000022}
 #credits{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fffffff2;border-radius:16px;color:#2a4a7a;padding:20px 22px;font-size:13px;line-height:1.8;z-index:40;display:none;max-width:84vw;box-shadow:0 10px 40px #0005;text-align:left}
 #credits h3{margin:0 0 8px;font-size:15px;text-align:center}
 #creditsClose{display:block;margin:12px auto 0;background:#3a6cd8;border:none;color:#fff;border-radius:10px;padding:7px 24px;font-size:13px;font-family:inherit;font-weight:700}
