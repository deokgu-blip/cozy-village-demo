<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bubble Roll — Level 1 (POC)</title>
<style>
  :root {
    --design-w: 676; --design-h: 1528;
    --c-red:#ff5b5b; --c-yellow:#ffd23f; --c-blue:#4d7cff; --c-green:#4fd07a;
    --bg-base:#1f2330; --bg-panel:#2b3040; --bg-inset:#171a24;
    --ui-accent:#8a5cff; --ui-success:#46c46a; --ui-gold:#ffcc3e; --ui-danger:#ff5b5b;
    --ui-text:#fff; --ui-dim:rgba(10,12,20,0.72);
    --panel-radius:24px; --btn-radius:18px; --badge-radius:14px;
    --hud-font:800 26px/1 "Baloo 2", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg-base); overflow:hidden;
    font-family:"Baloo 2", system-ui, -apple-system, sans-serif; user-select:none;
    touch-action:none; overscroll-behavior:none; }   /* ★iOS: 스크롤/바운스 차단 */
  body { position:fixed; inset:0; width:100%; }       /* ★iOS: 주소창 개폐·러버밴드로 인한 좌표 밀림 방지 */
  #stage {
    position:relative; width:100%; height:100%;
    max-width:min(100vw, calc(100vh * 676 / 1528));
    max-width:min(100vw, calc(100dvh * 676 / 1528));   /* ★iOS: 100vh=大뷰포트 → 실높이(dvh)로 종횡비 뒤틀림 방지 */
    margin:0 auto; background:var(--bg-base);
    aspect-ratio:676 / 1528;
    touch-action:none;   /* ★iOS: 더블탭 줌 차단 — 줌으로 인한 탭 좌표 오프셋 방지 */
  }
  #game { position:absolute; inset:0; }
  #game canvas { display:block; width:100%; height:100%; }

  /* L0 상단 UI 바 (HTML 오버레이) — 레퍼런스: 페리윙클 배경 위 둥근 알약 UI */
  #hud {
    position:absolute; left:0; right:0; top:0; height:17.7%;
    padding:18px 20px 8px; z-index:5; pointer-events:none;
    color:var(--ui-text);
  }
  .hud-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  /* 좌측 설정 버튼 — 보라 라운드 정사각, 두툼한 아래 그림자(말랑 토이) */
  .hud-btn { width:54px; height:54px; border-radius:16px;
    background:linear-gradient(180deg,#9a6cff,#7b4cf0);
    display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35), 0 4px 0 rgba(70,40,140,.55); }
  /* 중앙 레벨 알약 — 연보라 그라데, 흰 외곽 라인 */
  #hud-level { font:800 24px/1 "Baloo 2", system-ui, sans-serif; letter-spacing:.3px; color:#fff;
    background:linear-gradient(180deg,#b79bff,#9a78f5); border:2px solid rgba(255,255,255,.55);
    padding:11px 30px; border-radius:24px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 4px 0 rgba(70,40,140,.45); }
  /* 우측 코인 알약 + 플러스 버튼 */
  .coin-wrap { display:flex; align-items:center; gap:8px; }
  .coins { display:flex; align-items:center; gap:8px; font-weight:800; font-size:23px; color:#fff;
    background:linear-gradient(180deg,#b79bff,#9a78f5); border:2px solid rgba(255,255,255,.55);
    padding:8px 16px 8px 12px; border-radius:22px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 4px 0 rgba(70,40,140,.45); }
  .coin-dot { width:28px; height:28px; border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#ffe27a,#f5b626);
    border:2px solid #e09a12; box-shadow:inset 0 -3px 0 rgba(180,120,0,.35); }
  .plus-btn { width:54px; height:54px; border-radius:16px;
    background:linear-gradient(180deg,#ffd154,#f5a623);
    border:2px solid rgba(255,255,255,.5);
    display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800; color:#fff;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 4px 0 rgba(190,120,0,.5); }
  /* 잠긴 레벨 미리보기 3개 알약 */
  .lvl-preview { display:flex; gap:18px; justify-content:center; margin-top:16px; }
  .lvl-card { width:96px; height:90px; border-radius:20px;
    background:linear-gradient(180deg,#c4d0bf,#a9bba6);
    border:2px solid rgba(255,255,255,.4);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 3px 0 rgba(70,90,70,.35); }
  .lvl-card .lock { font-size:30px; line-height:1; filter:drop-shadow(0 1px 0 rgba(0,0,0,.25)); }
  .lvl-card .lvl-name { font-weight:800; font-size:17px; color:#3c4a3a;
    text-shadow:0 1px 0 rgba(255,255,255,.4); }
  /* 미사용(엔진 setText 가드로 안전) */
  #hud-diff-wrap, #boosters, #hud-rail { display:none; }

  /* 결과 오버레이 — 뷰포트 전체를 덮는다(레터박스 여백까지, [L33]) */
  #result { position:fixed; inset:0; z-index:10; display:none;
    align-items:center; justify-content:center; background:var(--ui-dim); }
  #result.show { display:flex; }
  .result-panel { background:var(--ui-accent); border-radius:var(--panel-radius);
    padding:36px 40px; text-align:center; color:#fff; box-shadow:0 12px 40px rgba(0,0,0,.5);
    min-width:260px; }
  #result.lose .result-panel { background:#3a2030; }
  #result-title { font-size:30px; font-weight:800; margin-bottom:8px; }
  #result-sub { font-size:18px; opacity:.9; margin-bottom:20px; }
  .result-gift { font-size:54px; margin-bottom:14px; }
  .result-btn { display:inline-block; background:var(--ui-success); color:#fff;
    padding:14px 36px; border-radius:var(--btn-radius); font-weight:800; font-size:20px;
    box-shadow:0 4px 0 rgba(0,0,0,.3); }
</style>
</head>
<body>
<div id="stage">
  <div id="game"></div>
  <!-- L0 HTML HUD — 레퍼런스: 설정 / 레벨 알약 / 코인+플러스 + 잠긴 레벨 3개 -->
  <div id="hud">
    <div class="hud-row">
      <div class="hud-btn" data-ui="settings">&#9881;</div>
      <div id="hud-level" data-ui="level">Level 1</div>
      <div class="coin-wrap" data-ui="coins">
        <div class="coins"><span class="coin-dot"></span><span id="hud-coins">0</span></div>
        <div class="plus-btn">+</div>
      </div>
    </div>
    <div class="lvl-preview">
      <div class="lvl-card" data-ui="card1"><span class="lock">&#128274;</span><span class="lvl-name">lvl 06</span></div>
      <div class="lvl-card" data-ui="card2"><span class="lock">&#128274;</span><span class="lvl-name">lvl 08</span></div>
      <div class="lvl-card" data-ui="card3"><span class="lock">&#128274;</span><span class="lvl-name">lvl 11</span></div>
    </div>
    <!-- 미사용(엔진 setText 가드로 안전) -->
    <span id="hud-diff" style="display:none"></span>
    <span id="hud-mag" style="display:none"></span>
    <span id="hud-shoot" style="display:none"></span>
    <span id="hud-shuf" style="display:none"></span>
  </div>
  <!-- 결과창 -->
  <div id="result">
    <div class="result-panel">
      <div class="result-gift">&#127881;</div>
      <div id="result-title">Level Completed!</div>
      <div id="result-sub">+25 코인</div>
      <div class="result-btn">&#9654; Continue</div>
    </div>
  </div>
</div>
